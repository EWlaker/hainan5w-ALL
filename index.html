<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>海南島 五萬分一 · 三套歷史地形圖对照</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  html,body{margin:0;height:100%;font-family:"Microsoft YaHei",system-ui,sans-serif}
  #map{position:absolute;inset:0;background:#2b2f36}
  .panel{position:absolute;top:12px;left:12px;z-index:1000;background:rgba(255,255,255,.95);
         border-radius:10px;padding:10px 12px;box-shadow:0 2px 12px rgba(0,0,0,.25);font-size:13px;line-height:1.8}
  .panel h1{margin:0 0 4px;font-size:15px;font-weight:700}
  .panel .sub{color:#888;font-size:11px;line-height:1.5}
  .panel label{display:flex;align-items:center;gap:6px;cursor:pointer}
  .panel hr{border:0;border-top:1px solid #e5e5e5;margin:8px 0}
  .sw{display:inline-block;width:10px;height:10px;border-radius:2px}
  #hint{position:absolute;bottom:12px;left:12px;z-index:1000;background:rgba(255,255,255,.9);
        border-radius:8px;padding:6px 10px;font-size:12px;color:#555}
</style>
</head>
<body>
<div id="map"></div>
<div class="panel">
  <h1>海南島 五萬分一</h1>
  <div class="sub">三套不同版次 · 同一格网（13.18′×9.75′）· 可直接叠合对照</div>
  <hr>
  <label><input type="checkbox" id="lyA" checked><span class="sw" style="background:#2e6fb7"></span>A 中研院·廣東陸測局（101）</label>
  <label><input type="checkbox" id="lyB"><span class="sw" style="background:#2e8b57"></span>B 外邦図·日本陸測部（96）</label>
  <label><input type="checkbox" id="lyC"><span class="sw" style="background:#c8781e"></span>C 中研院 RCHSS（101）</label>
  <hr>
  <label><input type="checkbox" id="lyG"><span class="sw" style="background:#888"></span>图幅接合表（点格看图名）</label>
  <label>透明度 <input type="range" id="opa" min="30" max="100" value="100" style="width:110px;vertical-align:middle"></label>
  <div class="sub" id="tip"></div>
</div>
<div id="hint">滚轮缩放 · 拖动平移</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
/* ===== 只改这一处：把三个已发布的站点地址填进来 ===== */
const SITES = {
  A: 'https://ewlaker.github.io/hainan5w-A',
  B: 'https://ewlaker.github.io/hainan5w-B',
  C: 'https://ewlaker.github.io/hainan5w-C'
};
const DIRS = { A:'xyz_A_webp', B:'xyz_B_webp', C:'xyz_C_webp' };
const LABEL = { A:'A 中研院·廣東陸測局', B:'B 外邦図·日本陸測部', C:'C 中研院 RCHSS' };

const map = L.map('map', {center:[19.2,109.7], zoom:8});
L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',
  {maxZoom:18, attribution:'底图 © CARTO'}).addTo(map);

const layers = {};
for (const k of ['A','B','C']) {
  layers[k] = L.tileLayer(`${SITES[k]}/${DIRS[k]}/{z}/{x}/{y}.webp`, {
    minZoom:5, maxZoom:15, maxNativeZoom:15, attribution: LABEL[k]
  });
}
layers.A.addTo(map);

for (const k of ['A','B','C']) {
  document.getElementById('ly'+k).onchange = e =>
    e.target.checked ? layers[k].addTo(map) : map.removeLayer(layers[k]);
}
document.getElementById('opa').oninput = e => {
  const o = e.target.value/100;
  for (const k of ['A','B','C']) if (map.hasLayer(layers[k])) layers[k].setOpacity(o);
};

let grid = null;
fetch('sheets_index.geojson').then(r=>r.json()).then(gj=>{
  grid = L.geoJSON(gj, {
    style: f => ({color:'#e0a020', weight:1, fill:false,
                  opacity: f.properties.s==='ABC'?0.55:0.95,
                  dashArray: f.properties.s==='ABC'?null:'4 3'}),
    onEachFeature: (f,ly)=> ly.on('click', ()=>{
      document.getElementById('tip').textContent = f.properties.n + '（' + f.properties.s + '）';
    })
  });
  document.getElementById('lyG').onchange = e => e.target.checked ? grid.addTo(map) : map.removeLayer(grid);
}).catch(()=>{ document.getElementById('tip').textContent = '接合表未随包上传'; });

map.on('mousemove', ev => {
  const p = ev.latlng;
  document.getElementById('hint').textContent = 'N' + p.lat.toFixed(4) + '  E' + p.lon.toFixed(4) + '  ·  z' + map.getZoom();
});
</script>
</body>
</html>
